# News Agent — Source Configuration v2
# Bilingual feeds: English + Chinese (more languages coming)

active_sources:
  - adapter: rss
    config:
      feeds:
        # AI / ML
        - "https://hnrss.org/newest?points=100"
        - "https://arxiv.org/rss/cs.AI"
        - "https://arxiv.org/rss/cs.HC"
        # Design
        - "https://feeds.feedburner.com/AListApart"
        # Tech / Infra
        - "https://blog.railway.app/feed.xml"
      max_per_feed: 10
    enabled: true

  - adapter: rss_cn
    config:
      feeds:
        # AI / Technology
        - "https://www.jiqizhixin.com/rss"       # 机器之心
        - "https://www.qbitai.com/feed"            # 量子位
        - "https://36kr.com/feed"                  # 36氪
        - "https://sspai.com/feed"                 # 少数派
        # Design
        - "https://www.uisdc.com/feed"             # 优设
        # Business
        - "https://www.huxiu.com/rss/0.xml"        # 虎嗅
        # Developer
        - "https://www.oschina.net/news/rss"       # 开源中国
        - "https://www.infoq.cn/feed"              # InfoQ CN
      max_per_feed: 10
    enabled: true

  # World Monitor adapter — enable after connecting
  # - adapter: worldmonitor
  #   config:
  #     base_url: "https://your-wm.vercel.app"
  #   enabled: false

