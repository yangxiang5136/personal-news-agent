# --- LLM Configuration ---
llm:
  layer1:
    provider: deepseek        # or "anthropic" as fallback
    model: deepseek-chat
    base_url: https://api.deepseek.com
    env_key: DEEPSEEK_API_KEY

  layer2:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    env_key: ANTHROPIC_API_KEY
