<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Daily Brief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* ─── Design Tokens ────────────────────────────────────────────── */
    :root {
      --bg:          #0d0c0a;
      --surface:     #141210;
      --surface2:    #1a1815;
      --border:      rgba(200, 169, 110, 0.12);
      --border-dim:  rgba(200, 169, 110, 0.06);

      --text:        #ede4d7;
      --text-dim:    #8a7f72;
      --text-muted:  #4a433b;

      --gold:        #c8a96e;
      --gold-glow:   rgba(200, 169, 110, 0.18);
      --gold-dim:    rgba(200, 169, 110, 0.35);

      --en:          #6b9fd4;
      --cn:          #d4614e;
      --ja:          #c17bcf;
      --ko:          #6bbfa4;
      --de:          #a8b97a;

      --reinforce:   #5aad7e;
      --challenge:   #d9934a;
      --bridge:      #9b7ed6;
    }

    /* ─── Reset ────────────────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Loading screen ────────────────────────────────────────────── */
    #loading {
      position: fixed; inset: 0; z-index: 300;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      transition: opacity 0.6s ease;
    }
    #loading.fade-out { opacity: 0; pointer-events: none; }
    .loading-inner {
      display: flex; flex-direction: column; align-items: center; gap: 1.2rem;
    }
    .loading-mark {
      font-size: 1.2rem; color: var(--gold-dim);
      animation: spin-glow 3s ease-in-out infinite;
    }
    @keyframes spin-glow {
      0%,100% { opacity: 0.3; transform: rotate(0deg); }
      50%     { opacity: 0.9; transform: rotate(180deg); }
    }
    .loading-text {
      font-size: 0.55rem; letter-spacing: 0.25em;
      color: var(--text-muted); text-transform: uppercase;
      animation: blink 1.6s ease-in-out infinite;
    }
    @keyframes blink { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }

    /* ─── Top bar ──────────────────────────────────────────────────── */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 44px;
      display: flex; align-items: center;
      padding: 0 2.5rem 0 2rem;
      z-index: 200;
      background: linear-gradient(to bottom, var(--bg) 0%, transparent 100%);
    }
    .topbar-wordmark {
      font-size: 0.55rem; letter-spacing: 0.22em;
      color: var(--text-muted); text-transform: uppercase;
    }
    .topbar-wordmark span { color: var(--gold); }

    #gen-time {
      margin-left: 1.4rem;
      font-size: 0.5rem; color: var(--text-muted);
      letter-spacing: 0.06em;
    }
    #stale-warn {
      display: none; margin-left: 0.6rem;
      font-size: 0.5rem; color: var(--challenge);
      letter-spacing: 0.06em;
    }

    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 1rem; }

    .topbar-date { font-size: 0.5rem; color: var(--text-muted); letter-spacing: 0.06em; }

    #refresh-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: 'DM Mono', monospace;
      font-size: 0.5rem; letter-spacing: 0.12em;
      padding: 0.3em 0.75em; cursor: pointer; border-radius: 2px;
      transition: color 0.2s, border-color 0.2s, opacity 0.2s;
    }
    #refresh-btn:hover:not(:disabled) { color: var(--gold); border-color: var(--gold-dim); }
    #refresh-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    #refresh-btn.running { color: var(--challenge); border-color: rgba(217, 147, 74, 0.35); }
    #refresh-btn.done    { color: var(--reinforce); border-color: rgba(90, 173, 126, 0.35); }

    /* ─── Progress rail (right side) ───────────────────────────────── */
    #progress-rail {
      position: fixed; right: 1.2rem; top: 50%;
      transform: translateY(-50%);
      display: flex; flex-direction: column;
      align-items: center; gap: 5px;
      z-index: 200;
    }
    .dot {
      width: 3px; height: 3px; border-radius: 50%;
      background: var(--text-muted);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .dot.active { background: var(--gold); transform: scale(1.6); }

    /* ─── Feed container ─────────────────────────────────────────────── */
    #feed {
      width: 100%; height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    #feed::-webkit-scrollbar { display: none; }

    /* ─── Card ───────────────────────────────────────────────────────── */
    .card {
      width: 100%; height: 100vh;
      scroll-snap-align: start;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4rem 4.5rem 3rem 4rem;
      overflow: hidden;
    }

    /* Very subtle warm glow top-right corner */
    .card::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 90% 8%, rgba(200, 169, 110, 0.035) 0%, transparent 55%),
        radial-gradient(ellipse at 10% 92%, rgba(200, 169, 110, 0.015) 0%, transparent 45%);
      pointer-events: none;
    }

    /* Bottom border between cards */
    .card::after {
      content: '';
      position: absolute; bottom: 0; left: 4rem; right: 4.5rem;
      height: 1px;
      background: var(--border-dim);
    }

    /* ─── Card header ─────────────────────────────────────────────── */
    .card-header {
      display: flex; align-items: center; gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .lang-pill {
      font-size: 0.48rem; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase;
      padding: 0.18em 0.55em; border-radius: 2px;
    }
    .lang-en { background: rgba(107,159,212,0.12); color: var(--en); border: 1px solid rgba(107,159,212,0.25); }
    .lang-zh { background: rgba(212,97,78,0.12);  color: var(--cn); border: 1px solid rgba(212,97,78,0.25);  }
    .lang-ja { background: rgba(193,123,207,0.12);color: var(--ja); border: 1px solid rgba(193,123,207,0.25);}
    .lang-ko { background: rgba(107,191,164,0.12);color: var(--ko); border: 1px solid rgba(107,191,164,0.25);}
    .lang-de { background: rgba(168,185,122,0.12);color: var(--de); border: 1px solid rgba(168,185,122,0.25);}

    .rank-num {
      font-size: 0.5rem; color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    .source-name {
      font-size: 0.58rem; color: var(--text-muted);
      letter-spacing: 0.1em; text-transform: uppercase;
    }

    /* Composite score indicator */
    .header-score {
      margin-left: auto;
      display: flex; align-items: center; gap: 0.6rem;
    }
    .header-score-bar {
      width: 56px; height: 1.5px;
      background: var(--text-muted); border-radius: 1px;
      overflow: hidden;
    }
    .header-score-fill {
      height: 100%; background: var(--gold); border-radius: 1px;
    }
    .header-score-num {
      font-size: 0.52rem; color: var(--gold-dim);
    }

    /* ─── Title ───────────────────────────────────────────────────── */
    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.7rem, 3.5vw, 2.9rem);
      font-weight: 400; line-height: 1.18;
      color: var(--text);
      max-width: 820px;
      margin-bottom: 1.6rem;
    }
    .card-title a {
      color: inherit; text-decoration: none;
      transition: color 0.25s;
      background-image: linear-gradient(var(--gold), var(--gold));
      background-size: 0% 1px;
      background-repeat: no-repeat;
      background-position: 0 100%;
      transition: background-size 0.3s ease, color 0.25s;
    }
    .card-title a:hover {
      color: var(--gold);
      background-size: 100% 1px;
    }

    /* ─── Divider ─────────────────────────────────────────────────── */
    .divider {
      width: 36px; height: 1px;
      background: var(--gold-dim);
      margin-bottom: 1.5rem;
      border: none;
    }

    /* ─── Summary ─────────────────────────────────────────────────── */
    .card-summary {
      font-size: 0.72rem; line-height: 1.85;
      color: var(--text-dim);
      max-width: 620px;
      margin-bottom: 1.5rem;
    }

    /* ─── Rationale (why this item was selected) ───────────────────── */
    .card-rationale {
      font-size: 0.6rem; line-height: 1.7;
      color: var(--text-muted);
      font-style: italic;
      max-width: 520px;
      margin-bottom: 1.6rem;
      padding-left: 0.8rem;
      border-left: 1px solid var(--border);
    }

    /* ─── Score bars ──────────────────────────────────────────────── */
    .scores-section {
      display: flex; flex-direction: column; gap: 0.45rem;
      margin-bottom: 1.4rem;
    }
    .score-row {
      display: flex; align-items: center; gap: 0.75rem;
    }
    .score-dim-label {
      font-size: 0.5rem; text-transform: uppercase;
      letter-spacing: 0.09em; color: var(--text-muted);
      width: 70px; flex-shrink: 0;
    }
    .score-track {
      width: 100px; height: 1px;
      background: var(--text-muted);
      position: relative; border-radius: 1px;
    }
    .score-track-fill {
      position: absolute; top: 0; left: 0;
      height: 100%; background: var(--gold-dim);
      border-radius: 1px;
    }
    /* Highlight high scores */
    .score-track-fill.high { background: var(--gold); }
    .score-val {
      font-size: 0.5rem; color: var(--text-muted);
      min-width: 2ch;
    }
    .score-val.high { color: var(--gold); }

    /* ─── Connections ─────────────────────────────────────────────── */
    .connections-section {
      display: flex; flex-direction: column; gap: 0.45rem;
      margin-bottom: 1.4rem;
    }
    .conn-item {
      display: flex; align-items: flex-start; gap: 0.6rem;
      font-size: 0.58rem; line-height: 1.6;
    }
    .conn-badge {
      font-size: 0.46rem; text-transform: uppercase; letter-spacing: 0.09em;
      padding: 0.14em 0.45em; border-radius: 2px; flex-shrink: 0; margin-top: 0.1em;
    }
    .conn-reinforcement { background: rgba(90,173,126,0.10); color: var(--reinforce); border: 1px solid rgba(90,173,126,0.22); }
    .conn-challenge     { background: rgba(217,147,74,0.10);  color: var(--challenge); border: 1px solid rgba(217,147,74,0.22);  }
    .conn-bridge        { background: rgba(155,126,214,0.10); color: var(--bridge);    border: 1px solid rgba(155,126,214,0.22); }
    .conn-body { color: var(--text-dim); }
    .conn-mem-id { color: var(--text-muted); margin-right: 0.3rem; }

    /* ─── Footer ──────────────────────────────────────────────────── */
    .card-footer {
      display: flex; align-items: center;
      gap: 1.5rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--border-dim);
    }
    .read-btn {
      font-size: 0.52rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--gold-dim); text-decoration: none;
      display: flex; align-items: center; gap: 0.4rem;
      transition: color 0.2s;
    }
    .read-btn:hover { color: var(--gold); }
    .read-btn-arrow { font-size: 0.7rem; }
    .card-pos {
      margin-left: auto;
      font-size: 0.5rem; color: var(--text-muted); letter-spacing: 0.08em;
    }

    /* ─── Scroll hint (first card only) ────────────────────────────── */
    .scroll-hint {
      position: absolute; bottom: 1.8rem; left: 50%;
      transform: translateX(-50%);
      font-size: 0.48rem; color: var(--text-muted);
      letter-spacing: 0.14em; text-transform: uppercase;
      animation: bounce 2s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes bounce {
      0%,100% { opacity: 0.3; transform: translateX(-50%) translateY(0); }
      50%      { opacity: 0.7; transform: translateX(-50%) translateY(4px); }
    }

    /* ─── Empty state ─────────────────────────────────────────────── */
    #empty-state {
      display: none; position: fixed; inset: 0;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 1rem; text-align: center; padding: 2rem;
    }
    #empty-state.show { display: flex; }
    .empty-glyph {
      font-size: 2.5rem; color: var(--text-muted);
      margin-bottom: 1rem; line-height: 1;
    }
    .empty-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem; font-weight: 300;
      color: var(--text-dim); margin-bottom: 0.5rem;
    }
    .empty-body {
      font-size: 0.6rem; color: var(--text-muted);
      letter-spacing: 0.06em; line-height: 2.2;
    }
    .empty-body code {
      background: var(--surface2); padding: 0.2em 0.55em;
      border-radius: 2px; color: var(--gold); font-family: 'DM Mono', monospace;
    }

    /* ─── Running overlay ─────────────────────────────────────────── */
    #run-overlay {
      display: none; position: fixed; inset: 0; z-index: 150;
      background: rgba(13, 12, 10, 0.85);
      backdrop-filter: blur(4px);
      align-items: center; justify-content: center;
      flex-direction: column; gap: 1.2rem;
    }
    #run-overlay.show { display: flex; }
    .run-msg {
      font-size: 0.58rem; color: var(--text-dim);
      letter-spacing: 0.12em; text-align: center; line-height: 2;
    }

    /* ─── Responsive: tighter on small screens ──────────────────────── */
    @media (max-width: 600px) {
      .card { padding: 3rem 1.5rem 2.5rem 1.5rem; }
      .card-title { font-size: 1.6rem; }
      .score-track { width: 70px; }
      #topbar { padding: 0 1.5rem; }
      .topbar-date { display: none; }
    }
  </style>
</head>
<body>

<!-- ─── Loading ─────────────────────────────────────────────────── -->
<div id="loading">
  <div class="loading-inner">
    <div class="loading-mark">◈</div>
    <div class="loading-text">Loading brief</div>
  </div>
</div>

<!-- ─── Top bar ──────────────────────────────────────────────────── -->
<div id="topbar">
  <div class="topbar-wordmark">Daily <span>Brief</span></div>
  <span id="gen-time"></span>
  <span id="stale-warn">· stale</span>
  <div class="topbar-right">
    <button id="refresh-btn" onclick="triggerRun()">↺ Refresh</button>
    <span class="topbar-date" id="today-date"></span>
  </div>
</div>

<!-- ─── Progress dots ────────────────────────────────────────────── -->
<div id="progress-rail"></div>

<!-- ─── Feed ─────────────────────────────────────────────────────── -->
<div id="feed"></div>

<!-- ─── Empty state ──────────────────────────────────────────────── -->
<div id="empty-state">
  <div class="empty-glyph">◈</div>
  <div class="empty-title">No brief yet</div>
  <div class="empty-body">
    Generate today's feed with<br>
    <code>python run.py</code><br><br>
    or click <strong>↺ Refresh</strong> above to trigger it now.<br>
    The pipeline takes ~2 minutes.
  </div>
</div>

<!-- ─── Pipeline-running overlay ─────────────────────────────────── -->
<div id="run-overlay">
  <div class="loading-mark" style="font-size:1.5rem;">◈</div>
  <div class="run-msg">
    Pipeline running<br>
    <span style="color:var(--text-muted)">Fetching feeds · Scoring · Building brief</span><br>
    <span style="color:var(--text-muted);font-size:0.5rem;">~2 minutes · page will refresh automatically</span>
  </div>
</div>

<script>
/* ─── Constants ─────────────────────────────────────────────────── */
const SCORE_DIMS = [
  { key: 'project_relevance',   label: 'project'  },
  { key: 'mental_model_update', label: 'mental'   },
  { key: 'serendipity',         label: 'serendip' },
  { key: 'social_currency',     label: 'social'   },
  { key: 'time_sensitivity',    label: 'time'     },
];

const CONN_TYPES = ['reinforcement', 'challenge', 'bridge'];

let items = [];
let currentIdx = 0;
let pollTimer = null;

/* ─── Helpers ───────────────────────────────────────────────────── */
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function compositeScore(scores) {
  if (!scores) return 0;
  const vals = Object.values(scores).filter(v => typeof v === 'number');
  return vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length) : 0;
}

function normLang(lang) {
  if (!lang) return 'en';
  const l = lang.toLowerCase();
  if (l === 'zh' || l === 'cn' || l === 'chinese' || l === 'zh-cn') return 'zh';
  if (l === 'ja' || l === 'japanese') return 'ja';
  if (l === 'ko' || l === 'korean')   return 'ko';
  if (l === 'de' || l === 'german')   return 'de';
  return 'en';
}

function langLabel(lang) {
  return { en: 'EN', zh: 'CN', ja: 'JA', ko: 'KO', de: 'DE' }[lang] || 'EN';
}

/* ─── Render ────────────────────────────────────────────────────── */
function renderScoreRows(scores) {
  if (!scores) return '';
  return SCORE_DIMS.map(({ key, label }) => {
    if (scores[key] === undefined) return '';
    const val = scores[key];
    const pct = Math.min(100, (val / 10) * 100);
    const isHigh = val >= 7;
    return `
      <div class="score-row">
        <span class="score-dim-label">${label}</span>
        <div class="score-track">
          <div class="score-track-fill ${isHigh ? 'high' : ''}" style="width:${pct}%"></div>
        </div>
        <span class="score-val ${isHigh ? 'high' : ''}">${val.toFixed(1)}</span>
      </div>`;
  }).join('');
}

function renderConnections(conns) {
  if (!conns || !conns.length) return '';
  // Filter out placeholder "?" connections
  const real = conns.filter(c => {
    const text = c.snippet || c.rationale || c.text || '';
    const memId = c.memory_id || '';
    return text && text !== '?' && !(memId === '?' && !text);
  });
  if (!real.length) return '';
  const rows = real.map(c => {
    const type = CONN_TYPES.includes(c.connection_type) ? c.connection_type : 'bridge';
    const memId = c.memory_id && c.memory_id !== '?' ? `<span class="conn-mem-id">#${c.memory_id}</span>` : '';
    const text = c.snippet || c.rationale || c.text || '';
    return `
      <div class="conn-item">
        <span class="conn-badge conn-${type}">${type}</span>
        <span class="conn-body">${memId}${text}</span>
      </div>`;
  }).join('');
  return `<div class="connections-section">${rows}</div>`;
}

function renderCard(item, idx, total) {
  const lang = normLang(item.language);
  const score = item.composite_score || compositeScore(item.scores);
  const scorePct = Math.min(100, (score / 10) * 100);
  const isFirst = idx === 0;

  const scoreRows = renderScoreRows(item.scores);
  const connections = renderConnections(item.connections);
  const rationale = item.rationale
    ? `<div class="card-rationale">${item.rationale}</div>`
    : '';
  const summary = item.summary
    ? `<p class="card-summary">${item.summary}</p>`
    : '';
  const scrollHint = isFirst
    ? '<div class="scroll-hint">↓ scroll</div>'
    : '';
  const rank = item.rank || (idx + 1);

  return `
    <div class="card" data-idx="${idx}">
      <div class="card-header">
        <span class="lang-pill lang-${lang}">${langLabel(lang)}</span>
        <span class="rank-num">#${String(rank).padStart(2, '0')}</span>
        <span class="source-name">${escHtml(item.source_name || item.source || '—')}</span>
        <div class="header-score">
          <div class="header-score-bar">
            <div class="header-score-fill" style="width:${scorePct}%"></div>
          </div>
          <span class="header-score-num">${score.toFixed(1)}</span>
        </div>
      </div>

      <h1 class="card-title">
        <a href="${item.url || '#'}" target="_blank" rel="noopener noreferrer">
          ${escHtml(item.title || 'Untitled')}
        </a>
      </h1>

      <hr class="divider">

      ${summary}
      ${rationale}

      ${scoreRows ? `<div class="scores-section">${scoreRows}</div>` : ''}
      ${connections}

      <div class="card-footer">
        <a class="read-btn" href="${item.url || '#'}" target="_blank" rel="noopener noreferrer">
          Read
          <span class="read-btn-arrow">→</span>
        </a>
        <span class="card-pos">${idx + 1} / ${total}</span>
      </div>

      ${scrollHint}
    </div>`;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ─── Progress rail ─────────────────────────────────────────────── */
function buildRail(n) {
  const rail = document.getElementById('progress-rail');
  rail.innerHTML = Array.from({ length: n }, (_, i) =>
    `<div class="dot ${i === 0 ? 'active' : ''}" onclick="jumpTo(${i})"></div>`
  ).join('');
}

function setActiveDot(idx) {
  currentIdx = idx;
  document.querySelectorAll('.dot').forEach((d, i) =>
    d.classList.toggle('active', i === idx)
  );
}

function jumpTo(idx) {
  const cards = document.getElementById('feed').querySelectorAll('.card');
  if (cards[idx]) cards[idx].scrollIntoView({ behavior: 'smooth' });
}

/* ─── Init feed ─────────────────────────────────────────────────── */
function initFeed(data) {
  let all = data.all_items || data.items || data;
  if (!Array.isArray(all)) all = [];

  // Prefer items marked selected/included, otherwise take top by rank
  let selected = all.filter(i => i.selected === true || i.included_in_briefing === true);
  if (!selected.length) {
    // Fall back: sort by composite score or rank and take top 10
    selected = [...all]
      .sort((a, b) => {
        const ra = a.rank || 999, rb = b.rank || 999;
        if (ra !== 999 && rb !== 999 && ra !== rb) return ra - rb;
        return compositeScore(b.scores) - compositeScore(a.scores);
      })
      .slice(0, 10);
  }
  selected.sort((a, b) => (a.rank || 0) - (b.rank || 0));

  items = selected;

  if (!items.length) {
    showEmpty();
    return;
  }

  const feed = document.getElementById('feed');
  feed.innerHTML = items.map((item, i) => renderCard(item, i, items.length)).join('');
  buildRail(items.length);

  // Intersection observer for scroll-spy
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) setActiveDot(parseInt(e.target.dataset.idx, 10));
    });
  }, { threshold: 0.6 });
  feed.querySelectorAll('.card').forEach(c => observer.observe(c));

  // Generated-at + staleness indicator
  if (data.generated_at) {
    document.getElementById('gen-time').textContent = fmtDate(data.generated_at);
    const ageH = (Date.now() - new Date(data.generated_at)) / 3600000;
    if (ageH > 24) document.getElementById('stale-warn').style.display = 'inline';
  }
}

/* ─── Empty state ────────────────────────────────────────────────── */
function showEmpty() {
  document.getElementById('empty-state').classList.add('show');
  document.getElementById('feed').style.visibility = 'hidden';
  document.getElementById('progress-rail').style.display = 'none';
}

/* ─── Load feed ─────────────────────────────────────────────────── */
async function loadFeed() {
  try {
    const res = await fetch('/api/feed');
    if (!res.ok) { showEmpty(); return; }
    const data = await res.json();
    initFeed(data);
  } catch {
    showEmpty();
  } finally {
    const loading = document.getElementById('loading');
    loading.classList.add('fade-out');
    setTimeout(() => loading.remove(), 700);
  }
}

/* ─── Trigger pipeline run ───────────────────────────────────────── */
async function triggerRun() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  btn.classList.add('running');
  btn.textContent = '⟳ Running…';

  try {
    const res = await fetch('/api/run', { method: 'POST' });
    if (res.status === 409) {
      // Already running
      startPolling();
      document.getElementById('run-overlay').classList.add('show');
      return;
    }
    if (!res.ok) {
      btn.textContent = '✗ Error';
      btn.classList.remove('running');
      setTimeout(resetBtn, 2500);
      return;
    }
    // 200: started → show overlay + poll
    document.getElementById('run-overlay').classList.add('show');
    startPolling();
  } catch {
    btn.textContent = '✗ Error';
    btn.classList.remove('running');
    setTimeout(resetBtn, 2500);
  }
}

function resetBtn() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = false;
  btn.classList.remove('running', 'done');
  btn.textContent = '↺ Refresh';
}

/* ─── Poll /api/status until run completes ───────────────────────── */
let lastGenTime = null;

async function pollStatus() {
  try {
    const res = await fetch('/api/status');
    if (!res.ok) return;
    const data = await res.json();
    const newGenTime = data.feed?.generated_at;

    if (newGenTime && newGenTime !== lastGenTime && lastGenTime !== null) {
      // Feed updated — reload
      clearInterval(pollTimer);
      pollTimer = null;
      location.reload();
      return;
    }
    lastGenTime = lastGenTime || newGenTime;

    if (!data.running && lastGenTime && newGenTime === lastGenTime) {
      // Process ended but feed didn't change (possible error)
      clearInterval(pollTimer);
      pollTimer = null;
      document.getElementById('run-overlay').classList.remove('show');
      const btn = document.getElementById('refresh-btn');
      btn.classList.remove('running');
      btn.textContent = '↺ Refresh';
      btn.disabled = false;
    }
  } catch { /* ignore */ }
}

function startPolling() {
  // Capture current gen time as baseline
  fetch('/api/status').then(r => r.json()).then(d => {
    lastGenTime = d.feed?.generated_at || null;
  }).catch(() => {});
  pollTimer = setInterval(pollStatus, 8000);
}

/* ─── Keyboard navigation ────────────────────────────────────────── */
document.addEventListener('keydown', e => {
  if (['ArrowDown', 'ArrowRight', ' ', 'j'].includes(e.key)) {
    e.preventDefault();
    jumpTo(Math.min(currentIdx + 1, items.length - 1));
  } else if (['ArrowUp', 'ArrowLeft', 'k'].includes(e.key)) {
    e.preventDefault();
    jumpTo(Math.max(currentIdx - 1, 0));
  } else if (e.key === 'Home') {
    e.preventDefault(); jumpTo(0);
  } else if (e.key === 'End') {
    e.preventDefault(); jumpTo(items.length - 1);
  }
});

/* ─── Boot ───────────────────────────────────────────────────────── */
document.getElementById('today-date').textContent = new Date().toLocaleDateString('en-US', {
  weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
});
loadFeed();
</script>
